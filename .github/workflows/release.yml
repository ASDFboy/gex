# Builds GEX for Windows and Linux and publishes a GitHub release with GEX.zip, gex-windows.exe
# and gex-linux (the last two are what GEX downloads when it updates itself).
# Runs when main is pushed with a new version in Cargo.toml (one with no release yet), when the
# release branch is pushed, or from Actions → Release → Run workflow.
# The release is named after the version in Cargo.toml; a release with that tag is updated.
name: Release
on:
  workflow_dispatch:
  push:
    branches: [main, release]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # On main, only a version that hasn't been released yet is built.
          if [ "$GITHUB_REF_NAME" = "main" ] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tools
        if: steps.v.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev pkg-config zip
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        if: steps.v.outputs.skip != 'true'
      - name: Test
        if: steps.v.outputs.skip != 'true'
        run: cargo test --release --workspace
      - name: Build for Windows
        if: steps.v.outputs.skip != 'true'
        run: cargo build --release --target x86_64-pc-windows-gnu -p gex-editor
      - name: Build for Linux
        if: steps.v.outputs.skip != 'true'
        run: cargo build --release -p gex-editor
      - name: Package
        if: steps.v.outputs.skip != 'true'
        run: |
          mkdir dist
          cp target/x86_64-pc-windows-gnu/release/gex.exe GEX.exe
          zip -9 dist/GEX.zip GEX.exe
          cp GEX.exe dist/gex-windows.exe
          cp target/release/gex dist/gex-linux
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.skip != 'true'
        with:
          tag_name: v${{ env.VERSION }}
          name: GEX ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: dist/*
