[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["third_party/jlb"]

[workspace.package]
version = "0.4.3"
edition = "2021"
authors = ["ASDFboy"]

[workspace.dependencies]
gex-core = { path = "crates/gex-core" }
gex-script = { path = "crates/gex-script" }
gex-assets = { path = "crates/gex-assets" }
gex-render = { path = "crates/gex-render" }
jlb = { path = "third_party/jlb" }
glam = { version = "0.33", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
slotmap = { version = "1", features = ["serde"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "gif", "webp", "ico", "tiff", "pnm", "qoi", "dds", "hdr", "exr", "ff"] }
rfd = "0.15"
egui-wgpu = "0.36"
steamlocate = "2"
gilrs = "0.11"
serde_json = "1"
gltf = "1"
tobj = "4"
vmdl = "0.2"
vbsp = "0.9"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "flac", "symphonia-all"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"
strip = true
